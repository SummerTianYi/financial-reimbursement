 return head(`晚上好，${h(u.name)} 👋`,'集中处理申请、审核和付款事项，让每笔费用都有迹可循。',u.role==='employee'?button('nav',icon('plus')+' 新建申请','btn-primary','data-route="new"'):'')+`<div class="stats-grid">${stats}</div><div class="two-col"><section class="card"><div class="card-header"><div><h2>${title}</h2><div class="subtle" style="margin-top:4px">${rows.length} 笔业务记录</div></div>${button('nav','查看全部 '+icon('right','sm'),'btn-sm btn-ghost',`data-route="${u.role==='employee'?'mine':u.role==='reviewer'?'reviews':u.role==='finance'?'payables':'audit'}"`)}</div>${billTable(rows)}</section><div style="display:flex;flex-direction:column;gap:19px"><div class="card"><div class="card-header"><h2>常用功能</h2></div><div class="card-body"><div class="quick-grid" style="grid-template-columns:repeat(${u.role==='reviewer'?'2':'3'},1fr)">${quick}</div></div></div><div class="notice">${icon('info','sm')} 当前为本地交互演示。你可以使用右上角账号切换，体验“员工提交 → 审核 → 财务批次 → 导出 Excel → 确认付款”的完整流程。</div></div></div>`;
}
function applyFilter(rows){let out=rows.slice();if(ui.search.trim()){const s=ui.search.trim().toLowerCase();out=out.filter(b=>[b.number,b.reason,b.category,b.dept,findUser(b.applicantId)?.name].some(v=>String(v||'').toLowerCase().includes(s)))}if(ui.filter!=='ALL')out=out.filter(b=>b.status===ui.filter);if(ui.department!=='ALL')out=out.filter(b=>b.dept===ui.department);if(ui.from)out=out.filter(b=>dateOnly(b.createdAt)>=ui.from);if(ui.to)out=out.filter(b=>dateOnly(b.createdAt)<=ui.to);return out.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));}
function filters({statuses=true,departments=false,dates=false}={}){return `<div class="filters"><div style="position:relative;min-width:195px;flex:1">${icon('search','sm')}<input class="field search" style="width:100%;padding-left:33px" data-filter="search" placeholder="搜索单号、姓名或报销事由" value="${h(ui.search)}"></div>${statuses?`<select class="field" data-filter="status">${selectOptions(Object.keys(STATUSES),ui.filter,'全部状态').replace(/>([^<]*)<\/option>/g,(m)=>m)}</select>`:''}${departments?`<select class="field" data-filter="department">${selectOptions(deptNames,ui.department,'全部部门')}</select>`:''}${dates?`<label>从 <input class="field" data-filter="from" type="date" value="${h(ui.from)}"></label><label>至 <input class="field" data-filter="to" type="date" value="${h(ui.to)}"></label>`:''}<button class="btn btn-sm btn-ghost" data-action="clear-filters">重置筛选</button></div>`.replace(/<option value="([A-Z]+)"([^>]*)>\1<\/option>/g,(_,code,attrs)=>`<option value="${code}"${attrs}>${STATUSES[code]||code}</option>`)}
function listPage(kind){const u=user();let title='',desc='',rows=[],opts={statuses:true,departments:false,dates:true};let actions='';if(kind==='mine'){title='我的报销单';desc='查看所有申请，继续编辑草稿和已退回的单据';rows=data.bills.filter(b=>b.applicantId===current);actions=button('nav',icon('plus')+' 新建报销单','btn-primary','data-route="new"');}if(kind==='history'){title='历史报销记录';desc='按状态与日期查询申请与付款进度';rows=data.bills.filter(b=>b.applicantId===current&&b.status!=='DRAFT');}if(kind==='reviews'){title='待我审核';desc='仅展示分配给当前审核账号的申请';rows=data.bills.filter(canReview);opts.statuses=false;opts.dates=false;}if(kind==='reviewHistory'){title='我的审核记录';desc='查看已处理或曾经退回的审核申请及审核意见';rows=data.bills.filter(b=>b.reviewerId===current&&(b.reviewOpinion||data.logs.some(l=>l.ref===b.number&&['审核通过','审核退回'].includes(l.action))));opts.dates=false;}if(kind==='payables'){title='财务待报销';desc='只可选择审核通过、尚未进入有效批次的申请；所选单据将被锁定到同一批次';rows=data.bills.filter(b=>b.status==='APPROVED'&&!hasBatch(b));opts.statuses=false;opts.departments=true;actions=button('create-batch',icon('layers')+' 创建报销批次','btn-primary');}const shown=applyFilter(rows);

function startForm(bill){if(user()?.role!=='employee')return;const b=bill||{};ui.form={billId:bill?.id||null,category:b.category||'',reason:b.reason||'',remark:b.remark||'',items:(bill?bill.items:[{id:id('item'),type:data.categories[0],date:shortDate(),cents:0,note:'',attachments:[]}]).map(x=>({...x,amountInput:x.cents?decimal(x.cents):'',attachments:(x.attachments||[]).map(a=>({...a}))}))};ui.page='new';ui.mobile=false;render();}

function formPage(){if(!ui.form)ui.form={billId:null,category:'',reason:'',remark:'',items:[{id:id('item'),type:data.categories[0],date:shortDate(),amountInput:'',note:'',attachments:[]}]};const f=ui.form,old=f.billId&&getBill(f.billId);if(old&&!(old.applicantId===current&&['DRAFT','RETURNED'].includes(old.status))){ui.form=null;ui.page='mine';return listPage('mine')}const lineRows=f.items.map((it,i)=>`<div class="expense-row" data-item-row="${h(it.id)}"><div class="expense-row-head"><strong>费用明细 ${String(i+1).padStart(2,'0')}</strong>${f.items.length>1?`<button class="btn-link" style="color:#c66f74" data-action="remove-item" data-item="${h(it.id)}">${icon('trash','sm')} 删除</button>`:''}</div><div class="expense-fields"><div><label class="form-label">费用类型 <span class="req">*</span></label><select class="field" data-field="type">${selectOptions(data.categories,it.type)}</select></div><div><label class="form-label">发生日期 <span class="req">*</span></label><input class="field" type="date" data-field="date" value="${h(it.date)}"></div><div><label class="form-label">金额（元） <span class="req">*</span></label><input class="field amount-input" data-field="amount" inputmode="decimal" placeholder="0.00" value="${h(it.amountInput)}"></div><div class="wide"><label class="form-label">费用说明 <span class="req">*</span></label><input class="field" data-field="note" maxlength="180" placeholder="例：购买三套测试设备连接线" value="${h(it.note)}"></div><div class="wide"><div class="btn-row"><label class="upload-btn">${icon('upload','sm')} 上传票据（图片 / PDF）<input type="file" data-upload="${h(it.id)}" accept="image/png,image/jpeg,image/webp,application/pdf,.png,.jpg,.jpeg,.webp,.pdf" multiple class="hidden"></label><span class="helper">最多 5 个/笔，单个不超过 8 MB</span></div><div class="receipt-list">${it.attachments.map(a=>`<span class="receipt-pill">${icon('receipt','sm')}<button class="file-name btn-link" title="预览/下载票据" data-action="open-receipt" data-file="${h(a.id)}">${h(a.name)}</button><button title="移除附件" data-action="remove-receipt" data-item="${h(it.id)}" data-file="${h(a.id)}">×</button></span>`).join('')}</div></div></div></div>`).join('');const total=f.items.reduce((s,x)=>s+(cents(x.amountInput)||0),0);
 return head(old?'编辑报销申请':'新建报销申请',old?`当前单据：${h(old.number)} · ${statusBadge(old.status)} · 重新提交后需再次审核`:'填写基本信息与多笔费用，系统将自动计算合计金额',button('nav','返回列表','btn-ghost','data-route="mine"'))+`<div class="form-layout"><section><div class="card" style="margin-bottom:20px"><div class="card-body"><div class="section-title"><h2><span class="section-n">1</span>申请信息</h2></div><div class="form-grid"><div class="form-group"><label class="form-label">申请人</label><input class="field" disabled value="${h(user().name)}"></div><div class="form-group"><label class="form-label">所属部门</label><input class="field" disabled value="${h(user().dept)}"></div><div class="form-group"><label class="form-label">报销类别 <span class="req">*</span></label><select class="field" id="form-category"><option value="">请选择类别</option>${selectOptions(data.categories,f.category)}</select></div><div class="form-group"><label class="form-label">申请日期</label><input class="field" disabled value="${old?dateOnly(old.createdAt):shortDate()}"></div><div class="form-group wide"><label class="form-label">报销事由 <span class="req">*</span></label><textarea class="field" rows="3" id="form-reason" maxlength="400" placeholder="请清楚说明本次报销的用途和背景">${h(f.reason)}</textarea></div><div class="form-group wide" style="margin-bottom:0"><label class="form-label">备注（选填）</label><input class="field" id="form-remark" maxlength="400" placeholder="其他需要说明的信息" value="${h(f.remark)}"></div></div></div></div><div class="card"><div class="card-body"><div class="section-title"><h2><span class="section-n">2</span>费用明细</h2><span class="small muted">支持多笔费用，逐笔关联票据</span></div>${lineRows}<button class="btn btn-soft" data-action="add-item">${icon('plus')} 添加一笔费用</button><div class="form-footer">${button('save-bill','保存草稿','btn-ghost')}${button('submit-bill',icon('check')+' 提交审核','btn-primary')}</div></div></div></section><aside class="card sticky-card"><div class="card-body"><h2 style="margin-bottom:13px">本次报销汇总</h2><div class="summary-line"><span>申请人</span><b>$ function validateAndSave(submit){if(user()?.role!=='employee')return;collectForm();const f=ui.form;if(!f)return;const old=f.billId?getBill(f.billId):null;if(old&&!(old.applicantId===current&&['DRAFT','RETURNED'].includes(old.status))){toast('当前状态不允许编辑','error');return}if(submit&&(!f.category||!f.reason.trim())){toast('请填写报销类别与报销事由','error');return}if(!f.items.length){toast('请至少添加一笔明细','error');return}const items=[];for(let i=0;i<f.items.length;i++){const r=f.items[i],value=r.amountInput.trim()?cents(r.amountInput):0;if(value===null){toast(`第 ${i+1} 笔金额格式错误，最多保留两位小数`,'error');return}if(submit&&(!r.type||!r.date||!r.note.trim()||!value)){toast(`请完整填写第 ${i+1} 笔费用明细与正数金额`,'error');return}if(r.date&&r.date>shortDate()){toast(`第 ${i+1} 笔发生日期不能晚于今天`,'error');return}items.push({id:r.id,type:r.type,date:r.date,cents:value,note:r.note.trim(),attachments:r.attachments});}const total=items.reduce((s,b)=>s+b.cents,0);if(!Number.isSafeInteger(total)){toast('报销总额过大','error');return}const reviewer=data.approvals[user().dept];if(submit&&(!reviewer||!findUser(reviewer)?.active||findUser(reviewer)?.role!=='reviewer')){toast('该部门未配置有效审核员，请联系管理员','error');return}
 let bill=old;if(!bill){const serial=data.serial++;const number='BX'+shortDate().replaceAll('-','')+String(serial).padStart(4,'0');bill={id:id('bill'),number,applicantId:current,dept:user().dept,createdAt:now(),revision:0,approvalSteps:[],batchId:null,approvedAt:null,paidAt:null,paymentBy:null};data.bills.unshift(bill)}bill.category=f.category;bill.reason=f.reason.trim();bill.remark=f.remark.trim();bill.items=items;bill.totalCents=total;bill.status=submit?'PENDING':(old?.status==='RETURNED'?'RETURNED':'DRAFT');if(submit){bill.submittedAt=now();bill.reviewerId=reviewer;bill.reviewOpinion='';bill.revision++;bill.approvalSteps.push({step:1,round:bill.revision,reviewerId:reviewer,status:'PENDING',opinion:'',submittedAt:now()});}log(submit?'提交报销申请':'保存报销草稿',bill.number,`${money(total)} · ${items.length} 笔费用${old&&submit?' · 退回后重新提交':''}`);if(!store())return;ui.form=null;ui.page='mine';render();toast(submit?'报销申请已提交，等待审核':'草稿保存成功');}
function openModal(title,body,footer='',large=false){const root=document.getElementById('modal-root');root.className='modal-root show';root.innerHTML=`<div class="modal ${large?'modal-large':''}"><div class="modal-head"><h2>${title}</h2><button class="btn btn-icon btn-ghost" data-action="close-modal" title="关闭">${icon('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer||button('close-modal','关闭','btn-ghost')}</div></div>`;}
function closeModal(){const root=document.getElementById('modal-root');root.className='modal-root';root.innerHTML=''}
function showBill(billId,review=false){const b=getBill(billId);if(!b||!eligibleVisible(b)){toast('没有查看权限','error');return}const owner=findUser(b.applicantId);const isFin=user().role==='finance';const isReviewer=user().role==='reviewer';const logs=data.logs.filter(l=>l.ref===b.number).slice().reverse();const entries=b.items.map((item,i)=>`<tr><td>${i+1}</td><td>${h(item.type)}</td><td>${h(item.date)}</td><td>${h(item.note||'—')}</td><td class="amount">${money(item.cents)}</td><td>${item.attachments.length?item.attachments.map(a=>`<button class="btn-link" data-action="open-receipt" data-file="${h(a.id)}">${h(a.name)}</button>`).join('<br>'):'—'}</td></tr>`).join('');const timeline=[{action:'创建报销单',at:b.createdAt,name:owner.name},...logs.map(l=>({action:l.action,at:l.at,name:findUser(l.actorId)?.name,detail:l.detail}))];const body=`<div class="record-header"><div><h3>${h(b.number)}</h3><div class="muted small">创建于 ${dateTime(b.createdAt)}</div></div>${statusBadge(b.status)}</div><div class="description-list"><div class="desc"><label>申请人 / 部门</label><span>${h(owner.name)} / ${h(b.dept)}</span></div><div class="desc"><label>报销类别</label><span>${h(b.category)}</span></div><div class="desc"><label>报销事由</label><span>${h(b.reason||'—')}</span></div><div class="desc"><label>审核人员</label><span>${h(findUser(b.reviewerId)?.name||'待分配')}</span></div><div class="desc"><label>审核通过时间</label><span>${dateTime(b.approvedAt)}</span></div><div class="desc"><label>报销批次</label><span>${h(getBatch(b.batchId)?.number||'—')}</span></div>${isFin?`<div class="desc" style="grid-column:1/-1"><label>收款信息（仅财务可见）</label><span>${h(owner.payee||'未维护')}</span></div>`:''}</div>${b.remark?`<p class="notice" style="margin-top:16px">备注：${h(b.remark)}</p>`:''}<div class="sep"></div><h3>费用明细 · 合计 ${money(b.totalCents)}</h3><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>费用类型</th><th>发生日期</th><th>说明</th><th>金额</th><th>附件</th></tr></thead><tbody>${entries}</tbody></table></div>${b.reviewOpinion?`<div class="notice ${b.status==='RETURNED'?'warn':'green'}" style="margin-top:15px"><b>审核意见：</b>${h(b.reviewOpinion)}</div>`:''}<div class="sep"></div><h3>操作时间线</h3><ul class="timeline">${timeline.map(t=>`<li><b>${h(t.action)} · ${h(t.name||'系统')}</b><p>${dateTime(t.at)}${t.detail?' · '+h(t.detail):''}</p></li>`).join('')}</ul>`;let footer=button('close-modal','关闭','btn-ghost');if(review&&canReview(b))footer=button('close-modal','取消','btn-ghost')+button('review-decision','退回修改','btn-danger',`data-id="${h(b.id)}" data-decision="reject"`)+button('review-decision',icon('check')+' 审核通过','btn-primary',`data-id="${h(b.id)}" data-decision="approve"`);if(isReviewer&&!review&&canReview(b))footer+=button('review-bill','开始审核','btn-primary',`data-id="${h(b.id)}"`);openModal('报销单详情',body,footer,true);}
function askDecision(billId,decision){const b=getBill(billId);if(!b||!canReview(b)){toast('该单据不在你的待审核范围内','error');return}const approved=decision==='approve';openModal(approved?'确认审核通过':'退回报销申请',`<p class="muted">${h(b.number)} · ${h(findUser(b.applicantId).name)} · ${money(b.totalCents)}</p><label class="form-label">审核意见 ${approved?'（选填）':'（必填）'}</label><textarea id="review-opinion" class="field" rows="4" placeholder="${approved?'例：单据核对无误，同意报销':'请说明需补充或修改的具体内容'}"></textarea>`,button('close-modal','取消','btn-ghost')+button('commit-review',approved?'确认通过':'确认退回',approved?'btn-primary':'btn-danger',`data-id="${b.id}" data-decision="${decision}"`));}
function commitReview(billId,decision){const b=getBill(billId);if(!b||!canReview(b)){toast('审核权限或状态发生变化','error');return}const opinion=document.getElementById('review-opinion')?.value?.trim()||'';if(decision==='reject'&&!opinion){toast('退回时必须填写审核意见','error');return}b.status=decision==='approve'?'APPROVED':'RETURNED';b.reviewOpinion=opinion||'审核通过';if(decision==='approve')b.approvedAt=now();const step=b.approvalSteps[b.approvalSteps.length-1];if(step){step.status=b.status;step.opinion=b.reviewOpinion;step.reviewedAt=now();step.reviewedBy=current}log(decision==='approve'?'审核通过':'审核退回',b.number,b.reviewOpinion);store();closeModal();render();toast(decision==='approve'?'审核已通过，单据进入财务待报销列表':'已退回申请人修改');}
function revokeBill(billId){const b=getBill(billId);if(!b||b.applicantId!==current||!['DRAFT','PENDING','RETURNED'].includes(b.status)){toast('当前单据无法撤销','error');return}openModal('撤销报销申请',`<div class="notice warn">${icon('alert','sm')} 确认撤销 ${h(b.number)}？撤销后不能恢复或重新提交，历史记录仍保留。</div>`,button('close-modal','取消','btn-ghost')+button('confirm-revoke','确认撤销','btn-danger',`data-id="${b.id}"`));}
function showBatchPage(){const rows=data.batches.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return head('报销批次管理','查看批次汇总、导出 Excel、完成线下付款确认',button('nav',icon('plus')+' 创建新批次','btn-primary','data-route="payables"'))+`<div class="stats-grid">${stat('有效批次数',String(rows.filter(b=>b.status!=='VOID').length),'财务归集批次数量','layers')}${stat('待付款批次',String(rows.filter(b=>b.status==='PROCESSING').length),'存在尚未确认的单据','clock','amber')}${stat('批次已付款',money(data.bills.filter(b=>b.status==='PAID').reduce((s,b)=>s+b.totalCents,0)),'已确认付款金额','checkcircle','mint')}${stat('未付款单据',String(data.bills.filter(b=>b.status==='BATCHED').length),'尚未完成打款','receipt','purple')}</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>批次编号</th><th>创建时间</th><th>创建人</th><th>单据数</th><th>金额合计</th><th>批次状态</th><th>操作</th></tr></thead><tbody>${rows.map(batch=>{const bs=batch.billIds.map(getBill).filter(Boolean);const count=bs.filter(b=>b.status==='PAID').length;return `<tr><td><button class="btn-link" data-action="batch-detail" data-id="${batch.id}">${h(batch.number)}</button></td><td>${dateTime(batch.createdAt)}</td><td>${h(findUser(batch.createdBy)?.name||'—')}</td><td>${bs.length} 笔</td><td class="amount">${money(bs.reduce((s,b)=>s+b.totalCents,0))}</td><td><span class="badge ${batch.status==='COMPLETED'?'status-PAID':'status-BATCHED'}">${batch.status==='COMPLETED'?'已完成':'待付款'} · ${count}/${bs.length}</span></td><td><div class="table-actions"><button class="btn-link" data-action="batch-detail" data-id="${batch.id}">查看</button><button class="btn-link" data-action="export-batch" data-id="${batch.id}" data-mode="all">导出 Excel</button></div></td></tr>`}).join('')}</tbody></table></div></div>`;}
function batchDetailPage(){const batch=getBatch(ui.batchView);if(!batch){ui.page='batches';return showBatchPage()}const bs=batch.billIds.map(getBill).filter(Boolean);const unpaid=bs.filter(b=>b.status==='BATCHED');const total=bs.reduce((s,b)=>s+b.totalCents,0);const paid=bs.filter(b=>b.status==='PAID');return head(`批次 ${h(batch.number)}`,`创建于 ${dateTime(batch.createdAt)} · ${h(findUser(batch.createdBy)?.name)} 创建`,button('nav','返回批次列表','btn-ghost','data-route="batches"'))+`<div class="stats-grid">${stat('批次总金额',money(total),'归集时的锁定金额','wallet')}${stat('报销单总数',String(bs.length),'此批次包含的单据','file','purple')}${stat('已确认金额',money(paid.reduce((s,b)=>s+b.totalCents,0)),'已完成线下付款','checkcircle','mint')}${stat('待确认金额',money(unpaid.reduce((s,b)=>s+b.totalCents,0)),'等待人工核验完成','clock','amber')}</div><div class="card" style="margin-bottom:19px"><div class="card-header"><h2>批次操作</h2><div class="btn-row">${button('export-batch',icon('download')+' Excel 汇总表','btn-ghost',`data-id="${batch.id}" data-mode="summary"`)}${button('export-batch',icon('download')+' Excel 明细表','btn-ghost',`data-id="${batch.id}" data-mode="detail"`)}${button('export-batch','完整工作簿','btn-soft',`data-id="${batch.id}" data-mode="all"`)}${unpaid.length?button('pay-batch',icon('check')+' 批量确认已报销','btn-primary',`data-id="${batch.id}"`):''}</div></div><div class="card-body"><div class="notice ${unpaid.length?'warn':'green'}">${unpaid.length?'批次已经锁定，需在完成线下打款后才能标记为已报销。点击确认时将记录操作人员和时间。':'此批次下的全部报销单均已确认付款，不可直接修改金额。'}</div></div></div><div class="card"><div class="card-header"><h2>批次报销单明细</h2><span class="muted small">${bs.length} 张单据</span></div><div class="table-wrap"><table class="table"><thead><tr><th>报销单号</th><th>姓名 / 部门</th><th>类别及事由</th><th>金额</th><th>审核通过时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${bs.map(b=>`<tr><td class="primary-cell">${h(b.number)}</td><td>${h(findUser(b.applicantId)?.name)}<div class="muted small">${h(b.dept)}</div></td><td>${h(b.category)}<div class="muted small">${h(b.reason)}</div></td><td class="amount">${money(b.totalCents)}</td><td class="nowrap">${dateTime(b.approvedAt)}</td><td>${statusBadge(b.status)}</td><td><button class="btn-link" data-action="view-bill" data-id="${b.id}">查看</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function askCreateBatch(){if(user()?.role!=='finance')return;const bs=[...ui.selected].map(getBill).filter(Boolean);if(!bs.length){toast('请先勾选需要报销的申请','error');return}if(bs.some(b=>b.status!=='APPROVED'||hasBatch(b))){toast('所选单据包含已加入批次或不符合条件的记录，请重新筛选','error');ui.selected.clear();render();return}const total=bs.reduce((s,b)=>s+b.totalCents,0);openModal('确认创建报销批次',`<p>本次将锁定 <b>${bs.length}</b> 张审核通过的单据，合计 <b style="font-size:22px;color:#376cf5">${money(total)}</b>。</p><div class="notice">${icon('shield','sm')} 创建后无法将同一张单据加入另一个有效批次。可通过批次页面导出报销汇总表及明细表。</div>`,button('close-modal','取消','btn-ghost')+button('commit-batch',icon('check')+' 确认创建','btn-primary'));}
function commitBatch(){if(user()?.role!=='finance')return;const selected=[...ui.selected];if(!selected.length)return;const bs=selected.map(getBill);if(bs.some(b=>!b||b.status!=='APPROVED'||hasBatch(b))){toast('创建失败：存在重复归集或状态已变化的单据','error');closeModal();ui.selected.clear();render();return}data.batchSerial++;const number='PC'+shortDate().replaceAll('-','')+String(data.batchSerial).padStart(4,'0');if(data.batches.some(b=>b.number===number)){toast('批次编号发生冲突，请重试','error');return}const batch={id:id('batch'),number,billIds:bs.map(b=>b.id),createdAt:now(),createdBy:current,status:'PROCESSING',completedAt:null};data.batches.unshift(batch);bs.forEach(b=>{b.batchId=batch.id;b.status='BATCHED';log('加入报销批次',b.number,number)});log('创建报销批次',number,`${bs.length} 张单据 · ${money(bs.reduce((s,b)=>s+b.totalCents,0))}`);store();ui.selected.clear();ui.batchView=batch.id;ui.page='batchDetail';closeModal();render();toast('批次创建成功，单据已锁定');}
function askPay(batchId){const b=getBatch(batchId);if(user()?.role!=='finance'||!b)return;const unpaid=b.billIds.map(getBill).filter(x=>x?.status==='BATCHED'&&x.batchId===batchId);if(!unpaid.length){toast('本批次无待报销单据');return}const total=unpaid.reduce((s,x)=>s+x.totalCents,0);openModal('确认线下打款已完成',`<div class="notice warn">${icon('alert','sm')} 请确认本批次中的 <b>${unpaid.length}</b> 张单据已经全部完成实际转账，合计 <b>${money(total)}</b>。此按钮仅登记付款结果，不会发起银行付款。</div><div style="margin-top:20px"><label class="form-label">操作备注（选填）</label><input id="pay-note" class="field" maxlength="200" placeholder="例：2026-10-08 银行统一转账完成"></div>`,button('close-modal','取消','btn-ghost')+button('commit-pay','确认全部已报销','btn-primary',`data-id="${b.id}"`));}
function commitPay(batchId){const batch=getBatch(batchId);if(user()?.role!=='finance'||!batch)return;const unpaid=batch.billIds.map(getBill).filter(b=>b?.status==='BATCHED'&&b.batchId===batchId);if(!unpaid.length){toast('无待报销单据','error');return}const note=document.getElementById('pay-note')?.value||'';for(const b of unpaid){b.status='PAID';b.paidAt=now();b.paymentBy=current;log('确认已报销',b.number,`${batch.number}${note?' · '+note:''}`)}batch.status='COMPLETED';batch.completedAt=now();log('完成报销批次',batch.number,`${unpaid.length} 张单据完成付款`);store();closeModal();render();toast('已完成批量报销确认，操作留痕成功');}
function usersPage(){const users=data.users;return head('用户管理','配置演示账号、所属部门和角色；真实的账号认证需服务端实现',button('add-user',icon('plus')+' 添加用户','btn-primary'))+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>用户</th><th>登录账号</th><th>部门</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>${users.map(u=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><span class="avatar ${classAvatar(u)}" style="width:32px;height:32px">${h(initials(u.name))}</span><strong>${h(u.name)}</strong></div></td><td>${h(u.username)}</td><td>${h(u.dept)}</td><td>${h(ROLES[u.role])}</td><td><span class="badge ${u.active?'status-PAID':'status-REVOKED'}">${u.active?'启用':'停用'}</span></td><td><button class="btn-link" data-action="edit-user" data-id="${u.id}">编辑</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function openUserEditor(idValue){if(user()?.role!=='admin')return;const u=data.users.find(x=>x.id===idValue);openModal(u?'编辑用户':'新增用户',`<div class="form-grid"><div class="form-group"><label class="form-label">真实姓名</label><input class="field" id="usr-name" value="${h(u?.name||'')}" maxlength="32"></div><div class="form-group"><label class="form-label">登录账号</label><input class="field" id="usr-account" value="${h(u?.username||'')}" ${u?'disabled':''} maxlength="36"></div><div class="form-group"><label class="form-label">所属部门</label><select id="usr-dept" class="field">${selectOptions(deptNames,u?.dept||deptNames[0])}</select></div><div class="form-group"><label class="form-label">用户角色</label><select id="usr-role" class="field">${Object.keys(ROLES).map(r=>`<option value="${r}" ${u?.role===r?'selected':''}>${ROLES[r]}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">账号状态</label><select id="usr-active" class="field"><option value="1" ${u?.active!==false?'selected':''}>启用</option><option value="0" ${u?.active===false?'selected':''}>停用</option></select></div><div class="form-group"><label class="form-label">收款信息（演示）</label><input id="usr-payee" class="field" value="${h(u?.payee||'')}" maxlength="120" placeholder="演示用途，请勿填真实卡号"></div></div><div class="notice warn">演示环境将资料保存在当前浏览器。不要录入真实收款账户、密码或个人敏感信息。</div>`,button('close-modal','取消','btn-ghost')+button('save-user','保存用户','btn-primary',`data-id="${idValue||''}"`));}
function saveUser(uid){if(user()?.role!=='admin')return;const name=document.getElementById('usr-name').value.trim(),username=document.getElementById('usr-account').value.trim(),dept=document.getElementById('usr-dept').value,role=document.getElementById('usr-role').value,active=document.getElementById('usr-active').value==='1',payee=document.getElementById('usr-payee').value.trim();if(!name||!username||!/^[a-zA-Z0-9_]{3,36}$/.test(username)){toast('请填写姓名及 3—36 位英文/数字账号','error');return}if(data.users.some(x=>x.username===username&&x.id!==uid)){toast('登录账号已存在','error');return}const old=uid?findUser(uid):null;if(old?.id===current&&(!active||role!=='admin')){toast('不能禁用当前管理员或移除自己的管理员角色','error');return}if(old){Object.assign(old,{name,dept,role,active,payee});log('修改账号',username,`${name} · ${ROLES[role]}`)}else{data.users.push({id:id('u'),name,username,dept,role,active,payee});log('创建账号',username,`${name} · ${ROLES[role]}`)}store();closeModal();render();toast('用户资料已保存');}
function approvalPage(){const rev=data.users.filter(u=>u.role==='reviewer'&&u.active);return head('审核流程配置','第一版采用部门对应一级审核员；保留每次提交的审批轮次记录')+`<div class="notice" style="margin-bottom:18px">${icon('shield','sm')} 设置影响后续提交和重新提交的单据，不追溯更改已提交申请当前的审核负责人。未来可在服务端扩展多级审批节点。</div><div class="card"><div class="card-header"><h2>部门默认审核员</h2><span class="small muted">修改后即时保存</span></div><div class="table-wrap"><table class="table"><thead><tr><th>部门名称</th><th>默认审核员</th><th>审批层级</th><th>备注</th></tr></thead><tbody>${deptNames.map(dept=>`<tr><td class="primary-cell">${dept}</td><td><select class="field" style="max-width:200px" data-approval-dept="${dept}"><option value="">未配置</option>${rev.map(x=>`<option value="${x.id}" ${data.approvals[dept]===x.id?'selected':''}>${h(x.name)}</option>`).join('')}</select></td><td>一级审核</td><td class="muted">员工提交后自动分配</td></tr>`).join('')}</tbody></table></div></div>`;}
function categoryPage(){return head('报销类别管理','管理表单中可选的类别，已有历史记录保持原类别名称')+`<div class="card"><div class="card-header"><h2>费用类别列表</h2>${button('add-category',icon('plus')+' 添加类别','btn-primary')}</div><div class="table-wrap"><table class="table"><thead><tr><th>类别</th><th>当前关联单据</th><th>操作</th></tr></thead><tbody>${data.categories.map(c=>`<tr><td class="primary-cell">${h(c)}</td><td>${data.bills.filter(b=>b.category===c||b.items.some(i=>i.type===c)).length} 张</td><td><button class="btn-link" style="color:#ce747a" data-action="delete-category" data-name="${h(c)}">删除</button></td></tr>`).join('')}</tbody></table></div></div>`;}
function auditPage(){const logs=data.logs;return head('系统操作日志','追溯提交、审核、批次归集、付款确认与配置操作')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>操作时间</th><th>操作人</th><th>操作类型</th><th>关联对象</th><th>操作内容</th></tr></thead><tbody>${logs.length?logs.map(l=>`<tr><td class="nowrap">${dateTime(l.at)}</td><td>${h(findUser(l.actorId)?.name||'未知')}</td><td class="primary-cell">${h(l.action)}</td><td>${h(l.ref)}</td><td>${h(l.detail)}</td></tr>`).join(''):`<tr><td colspan="5">${empty('暂无新操作日志','演示操作会自动记入当前浏览器')}</td></tr>`}</tbody></table></div></div>`;}

const DB_NAME='chengxu_expense_files_v1';let dbPromise=null;
function openFileDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('当前浏览器不支持 IndexedDB'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('receipts'))req.result.createObjectStore('receipts',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise;}
async function putFile(fileId,file){const db=await openFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('receipts','readwrite');tx.objectStore('receipts').put({id:fileId,blob:file,name:file.name,type:file.type,size:file.size});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getFile(fileId){const db=await openFileDB();return new Promise((resolve,reject)=>{const req=db.transaction('receipts','readonly').objectStore('receipts').get(fileId);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function deleteFile(fileId){try{const db=await openFileDB();await new Promise((resolve,reject)=>{const tx=db.transaction('receipts','readwrite');tx.objectStore('receipts').delete(fileId);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){}}
async function clearFiles(){const db=await openFileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('receipts','readwrite');tx.objectStore('receipts').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function attachFiles(itemId,files){if(!ui.form||user()?.role!=='employee')return;collectForm();const item=ui.form.items.find(x=>x.id===itemId);if(!item)return;let count=0;for(const f of files){const allowed=/\.(jpe?g|png|webp|pdf)$/i.test(f.name)&&['image/jpeg','image/png','image/webp','application/pdf',''].includes(f.type);if(!allowed){toast(`${f.name} 类型不支持，仅支持图片与 PDF`,'error');continue}if(f.size>8*1024*1024){toast(`${f.name} 超过 8 MB 限制`,'error');continue}if(item.attachments.length>=5){toast('每笔费用最多关联 5 个附件','error');break}const fileId=id('receipt');try{await putFile(fileId,f);item.attachments.push({id:fileId,name:f.name,type:f.type,size:f.size});count++}catch(e){toast('附件存储失败：'+e.message,'error');break}}render();if(count)toast(`已添加 ${count} 个票据附件（仅保存在当前浏览器）`)}
async function openReceipt(fileId){if(!user())return;const accessible=data.bills.some(b=>eligibleVisible(b)&&b.items.some(i=>i.attachments.some(a=>a.id===fileId)))||user()?.role==='employee'&&ui.form?.items.some(i=>i.attachments.some(a=>a.id===fileId));if(!accessible){toast('无权访问该附件','error');return}try{const file=await getFile(fileId);if(!file){toast('未找到原附件，可能已清除浏览器数据','error');return}const url=URL.createObjectURL(file.blob);const link=document.createElement('a');link.href=url;link.download=file.name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){toast('无法读取附件','error')}}

 default:break;}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.preventDefault();clickAction(el)}else if(event.target.id==='modal-root')closeModal()});
document.addEventListener('change',event=>{const e=event.target;if(e.id==='quick-user'){signIn(e.value);return}if(e.dataset.upload){attachFiles(e.dataset.upload,Array.from(e.files||[]));return}if(e.dataset.filter){const field=e.dataset.filter;ui[field==='status'?'filter':field]=e.value;render();return}if(e.id==='select-all'){const rows=applyFilter(data.bills.filter(b=>b.status==='APPROVED'&&!hasBatch(b)));rows.forEach(b=>{if(e.checked)ui.selected.add(b.id);else ui.selected.delete(b.id)});render();return}if(e.classList.contains('bill-check')){if(e.checked)ui.selected.add(e.dataset.bill);else ui.selected.delete(e.dataset.bill);const rows=applyFilter(data.bills.filter(b=>b.status==='APPROVED'&&!hasBatch(b)));document.getElementById('selected-count').textContent=rows.filter(b=>ui.selected.has(b.id)).length;document.getElementById('selected-sum').textContent=money(rows.filter(b=>ui.selected.has(b.id)).reduce((s,b)=>s+b.totalCents,0));const all=document.getElementById('select-all');if(all)all.checked=rows.length>0&&rows.every(b=>ui.selected.has(b.id));return}if(e.dataset.approvalDept&&user()?.role==='admin'){const rev=findUser(e.value);if(e.value&&(!rev||rev.role!=='reviewer'||!rev.active)){toast('仅可设置启用状态的审核员','error');return}data.approvals[e.dataset.approvalDept]=e.value;log('更新审核配置',e.dataset.approvalDept,rev?.name||'清除');store();toast('审批配置已更新')}});
document.addEventListener('input',event=>{if(event.target.classList.contains('amount-input'))updateFormTotal()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='Enter'&&!user()&&['username','password'].includes(document.activeElement?.id)){event.preventDefault();const btn=document.querySelector('[data-action="login"]');if(btn)clickAction(btn)}});
if(!localStorage.getItem(KEY))store();
render();
})();

</script>
</body></html>
